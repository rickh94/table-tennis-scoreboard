[package]
name = "api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.97"
axum = { version = "0.8.3", features = ["ws"] }
chrono = { version = "0.4.40", features = ["serde"] }
compact_str = { version = "0.9.0", features = ["serde"] }
dashmap = "6.1.0"
fastrand = "2.3.0"
futures = "0.3.31"
nanoid = "0.4.0"
rmp-serde = "1.3.0"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "trace", "cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ts-rs = { version = "10.1.0", features = ["chrono-impl", "serde-json-impl"] }

[dev-dependencies]
http-body-util = "0.1.3"
hyper-util = { version = "0.1.11", features = ["client", "client-legacy"] }
mime = "0.3.17"
regex = "1.11.1"
tokio-tungstenite = "0.26.2"
